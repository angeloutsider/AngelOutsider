<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Admin — Angel Outsider</title>
  <link rel="stylesheet" href="/AngelOutsider/static/css/admin-style.css">
</head>
<body>
  <div class="admin-wrapper">
    <header class="admin-header">
      <div class="admin-logo">Angel Outsider</div>
      <div class="admin-subtitle">Post Manager</div>
    </header>

    <div id="authSection" class="auth-section">
      <div class="auth-card">
        <h2>Connect to GitHub</h2>
        <p>Enter a GitHub <strong>fine-grained</strong> personal access token to manage posts. Scope it to only this repository with <strong>Contents: Read and write</strong> permission — do not use a classic token with full repo access.</p>
        <input type="password" id="patInput" placeholder="github_pat_..." autocomplete="off" />
        <button id="savePatBtn" class="btn-primary">Connect</button>
      </div>
    </div>

    <div id="mainSection" class="main-section" style="display:none;">
      <div class="section-header">
        <h2>Blog Posts</h2>
        <button id="newPostBtn" class="btn-primary">+ New Post</button>
      </div>
      <div id="postsLoading" class="loading-msg">Loading posts from GitHub...</div>
      <div id="postsList" class="posts-list"></div>
      <div id="postsError" class="error-msg" style="display:none;"></div>

      <div id="archivedSection" class="archived-section" style="display:none;">
        <button id="archivedToggle" class="archived-toggle">
          <span>Archived</span>
          <span id="archivedToggleIcon" class="archived-toggle-icon">▶</span>
        </button>
        <div id="archivedList" class="posts-list archived-list" style="display:none;"></div>
      </div>

      <div class="section-footer">
        <button id="signOutBtn" class="btn-ghost">Disconnect</button>
      </div>
    </div>
  </div>

  <script src="/AngelOutsider/static/js/admin.js" data-base-url="/AngelOutsider/"></script>
</body>
</html>
